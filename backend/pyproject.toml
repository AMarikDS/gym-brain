[tool.poetry]
name = "gym-brain-backend"
package-mode = false
version = "0.1.0"
description = "FastAPI backend for Gym Brain ML recommender system"
authors = ["AMarikDS"]
[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.111.0"
uvicorn = "^0.30.0"
pydantic = "^2.7.0"
pandas = "^2.2.0"
catboost = "^1.2.0"
torch = {version = "^2.0.0", source = "pytorch"}
httpx = "^0.27.0"
pytest = "^8.0.0"
transformers = "^5.17.0"
sentencepiece = "^0.2.2"
sacremoses = "^0.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
