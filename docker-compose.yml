version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8001:8080"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - ./backend/app:/app/app
      - ./models:/models
      
  frontend:
    build:
      context: ./frontend
    ports:
      - "3001:3000"
      - "8000:8000"
    environment:
      - API_URL=http://backend:8080
    volumes:
      - ./frontend/web:/app/web
      - ./frontend/rxconfig.py:/app/rxconfig.py
    depends_on:
      - backend
