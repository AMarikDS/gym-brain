name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install dependencies and tools
        run: |
          python -m pip install --upgrade pip
          pip install poetry black flake8 isort pytest httpx
          
      - name: Backend - Install dependencies
        working-directory: ./backend
        run: poetry install --no-interaction --no-ansi --no-root
          
      - name: Check code formatting (Black)
        run: |
          black --check backend/app backend/tests || echo "Black formatting issues found"
          
      - name: Check imports (isort)
        run: |
          isort --check-only backend/app backend/tests || echo "Isort issues found"
          
      - name: Lint with flake8
        run: |
          flake8 backend/app backend/tests --count --max-complexity=10 --max-line-length=120 --statistics || echo "Flake8 issues found"
          
      - name: Backend - Run tests
        working-directory: ./backend
        run: |
          poetry run pytest tests/

  docker-build:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Backend Image
        run: docker build -t gym-brain-backend:latest ./backend
        
      - name: Build Frontend Image
        run: docker build -t gym-brain-frontend:latest ./frontend
